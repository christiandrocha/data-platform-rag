name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff yamllint bandit
      - run: ruff check data_platform_rag tests scripts
      - run: yamllint -c .yamllint.yml docs/golden-set/ || true
      - run: bandit -r data_platform_rag -q

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dpr
          POSTGRES_PASSWORD: dpr_ci
          POSTGRES_DB: data_platform_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The golden set's version is its last commit (ADR-011), which a
          # shallow clone cannot report; the runner refuses one (ADR-008).
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # `eval` too, so the RAGAS tests run here instead of skipping (ADR-008 D4).
      - run: pip install -e ".[dev,eval]"
      - name: Apply schema
        env:
          PGPASSWORD: dpr_ci
        run: |
          psql -h localhost -U dpr -d data_platform_rag -f sql/00_extensions.sql
          psql -h localhost -U dpr -d data_platform_rag -f sql/01_schema.sql
          psql -h localhost -U dpr -d data_platform_rag -f sql/02_indexes.sql
          psql -h localhost -U dpr -d data_platform_rag -f sql/03_corpus_snapshot.sql
          psql -h localhost -U dpr -d data_platform_rag -f sql/04_query_log_product.sql
          psql -h localhost -U dpr -d data_platform_rag -f sql/05_query_log_origin.sql
      - run: pytest -q
        env:
          DATABASE_URL: postgresql://dpr:dpr_ci@localhost:5432/data_platform_rag
