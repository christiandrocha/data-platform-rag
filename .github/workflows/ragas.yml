name: ragas

# On demand only (ADR-008, Decision 7). The runner exists, but no regression
# threshold does: it is chosen from a noise measurement that needs the API key.
# A push trigger before that could only report deltas nobody can judge.
on:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dpr
          POSTGRES_PASSWORD: dpr_ci
          POSTGRES_DB: data_platform_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
    steps:
      - uses: actions/checkout@v4
        with:
          # The golden set's SHA is its last commit (ADR-011); a shallow clone
          # cannot report it, and the runner refuses one.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,eval]"
      - name: Apply schema
        env:
          PGPASSWORD: dpr_ci
        run: |
          psql -h localhost -U dpr -d data_platform_rag -f sql/00_extensions.sql
          psql -h localhost -U dpr -d data_platform_rag -f sql/01_schema.sql
          psql -h localhost -U dpr -d data_platform_rag -f sql/02_indexes.sql
          psql -h localhost -U dpr -d data_platform_rag -f sql/03_corpus_snapshot.sql
          psql -h localhost -U dpr -d data_platform_rag -f sql/04_query_log_product.sql
          psql -h localhost -U dpr -d data_platform_rag -f sql/05_query_log_origin.sql
      - name: Fetch corpus
        # ADR-012: the snapshot under /tmp/dpr-corpus-* is what index_corpus.py
        # reads, and a fresh runner has none. Both corpus repos are public, so
        # this step needs no credential.
        run: python scripts/fetch_corpus.py
      - name: Index corpus
        env:
          DATABASE_URL: postgresql://dpr:dpr_ci@localhost:5432/data_platform_rag
        run: python scripts/index_corpus.py
      - name: Contamination gate (ADR-011)
        run: python scripts/verify_adversarials.py
      - name: Run RAGAS
        env:
          DATABASE_URL: postgresql://dpr:dpr_ci@localhost:5432/data_platform_rag
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/run_evaluation.py all --out-dir eval-out
      - name: Upload run file and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragas-report
          path: eval-out/
