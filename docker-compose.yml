services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: data-platform-rag-postgres
    environment:
      POSTGRES_USER: dpr
      POSTGRES_PASSWORD: dpr_local_dev
      POSTGRES_DB: data_platform_rag
    ports:
      - "5432:5432"
    volumes:
      - dpr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dpr -d data_platform_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dpr_pgdata:
