# Corpus inventory — the ADRs that golden-set coverage is measured against.
#
# Hand-maintained, and therefore capable of going stale if a corpus repo gains an
# ADR. That risk is recorded in ADR-011 rather than solved; a check during
# corpus-indexing BUILD compares this file against a live clone.
#
# Coverage cannot be derived from expected_source_paths alone: that tells you
# which units ARE cited, never which exist and are missing — the only thing the
# check exists to find.
#
# Two unit classes:
#   adrs          — one ADR file, the coverage unit for `decision` questions
#   architecture  — README `##` sections, YAML contracts, dbt macros; the
#                   coverage units for `architecture` questions
#
# The architecture list was generated from a clone on 2026-09-14 and is
# hand-maintained from here. It must be complete BEFORE authoring starts: ADR-011
# fixes the walk-order seed as immutable, so units added mid-curation can only be
# appended to the end of the order, which defeats the interleaving they were
# meant to join.

# Seed for the authoring walk order (ADR-011, "Authoring order").
# IMMUTABLE for the life of this golden set generation. Re-shuffling mid-curation
# destroys the anti-bias property the seed exists to provide. A new seed is
# permitted only when a set is rebuilt from scratch, recorded with the reason.
