- id: q006
  provenance: human
  voice: technical
  intent: decision
  question: "Why does cluster_by have to match the MERGE key?"
  expected_answer: "Liquid clustering accelerates MERGE operations only when the MERGE key appears among the clustering columns. The query planner reads file statistics to skip any file that cannot contain matching records. Without this alignment, every MERGE triggers a full table scan, negating the optimization. The project's CI (test_contracts.py) validates this requirement automatically before deployment."
  expected_source_paths:
    - project: sdd-kafka-databricks
      path: docs/adr/004_liquid_clustering.md
  grounding_verified: true

- id: q007
  provenance: human
  voice: technical
  intent: decision
  question: "Why is the Bronze layer strictly insert-only, and what actually breaks if someone updates a row there?"
  expected_answer: "We only allow inserts in Bronze because our Streams are set to append-only, and the Silver layer expects deletes to arrive as new rows, not as changes to existing ones. If someone manually updates a Bronze row, the Stream just ignores it. Silver never gets the fix, and the two layers quietly get out of sync without any errors. A suggested fix is to simply revoke update and delete permissions for the CDC role on those tables."
  expected_source_paths:
    - project: sdd-kafka-snowflake-2
      path: docs/adr/0025_bronze_is_append_only.md
  grounding_verified: true

- id: q008
  provenance: human
  voice: technical
  intent: decision
  question: "Why did you choose to unwrap the Debezium envelope using a Single Message Transform in Kafka Connect, rather than handling it later in Databricks?"
  expected_answer: "We apply the ExtractNewRecordState transform inside Kafka Connect so the data lands in Bronze as flat rows, complete with the operation and timestamp markers. This makes the Spark code much simpler because we don't have to parse nested Avro structures. We still maintain the append-only nature and CDC tracking. The main trade-off is losing the \"before\" state, but since our pipeline is unidirectional and PostgreSQL remains the source of truth, we don't actually need the raw envelope for replay purposes."
  expected_source_paths:
    - project: sdd-kafka-databricks
      path: docs/adr/002_smt_and_bronze.md
  grounding_verified: true

- id: q009
  provenance: human
  voice: technical
  intent: decision
  question: "How do you decide which Gold models can be safely incrementalized, and why did you stop relying on table names to make that call?"
  expected_answer: "We decide by reading the actual SQL, not by guessing from table names. If a model is additive-partitionable, like summing metrics per driver, it is cheap to make incremental. Global ratios are trickier because every new row changes the denominator, though some with low cardinality can still be handled. Reading the SQL actually corrected some of our earlier assumptions, like realizing a user behavior model was cumulative rather than time-windowed. This decision itself didn't change any materializations; it just categorizes them so we are prepared when real volume makes it necessary."
  expected_source_paths:
    - project: sdd-kafka-snowflake-2
      path: docs/adr/0026_gold_aggregation_categories.md
  grounding_verified: true

- id: q010
  provenance: human
  voice: technical
  intent: decision
  question: "What were the main challenges when standardizing table prefixes and column names, and what unexpected issues came up during the live cutover?"
  expected_answer: "We added layer prefixes to all table names and standardized foreign key names. We initially tried to rename some timestamp columns, but had to roll that back because Debezium passes the exact database column name through Kafka, meaning a renamed contract field would never actually arrive from the payload. We kept the foreign key changes because we updated the entire propagation chain end-to-end, including the source fixtures, ensuring everything stayed consistent. During the live cutover, we hit two snags: an export script crashed on a silver-only contract missing a Kafka topic, and the Auto Loader schema checkpoint didn't clear on a full refresh, forcing us to manually delete that folder so the pipeline wouldn't reuse the old schema."
  expected_source_paths:
    - project: sdd-kafka-databricks
      path: docs/adr/009_naming_standardization.md
  grounding_verified: true

- id: q011
  provenance: human
  voice: technical
  intent: decision
  question: "Why did you move the pipeline trigger from Dagster polling into Snowflake Tasks, and how does that save compute costs?"
  expected_answer: "The old Dagster sensor kept waking up the warehouse every minute just to check for new data, meaning we paid for compute even when nothing arrived. We moved the gate into Snowflake by adding a Stream and a Task with a WHEN clause for each Tier-1 domain. Snowflake checks if the stream has data in its control plane, so a negative answer costs nothing. Since the Stream watches the actual Bronze table, it only triggers after Snowpipe commits the row, removing the guesswork of Kafka-side triggers. Dagster still runs the dbt jobs; it just stopped doing the polling."
  expected_source_paths:
    - project: sdd-kafka-snowflake-2
      path: docs/adr/0019_streams_and_triggered_tasks_as_the_gate.md
  grounding_verified: true
  grounding:
    - claim: "for each Tier-1 domain"
      project: sdd-kafka-snowflake-2
      path: docs/adr/0019_streams_and_triggered_tasks_as_the_gate.md
      quote: "One `STREAM` per Bronze table (the 10 Tier-1 domains of"

- id: q012
  provenance: human
  voice: technical
  intent: decision
  question: "Why did you choose Databricks as the destination for this pipeline instead of sticking with Snowflake, and what specific features drove that decision?"
  expected_answer: "We kept the upstream Kafka, Debezium, and PostgreSQL setup exactly the same, but swapped the destination layer to Databricks. The main drivers for this were the native GitOps orchestration provided by Databricks Asset Bundles, built-in data governance with Unity Catalog, and the ability for compute to scale down to zero when idle. It gave us a more unified ecosystem without needing external orchestration tools."
  expected_source_paths:
    - project: sdd-kafka-databricks
      path: docs/adr/001_databricks_vs_snowflake.md
  grounding_verified: true

- id: q013
  provenance: human
  voice: technical
  intent: decision
  question: "Why use a separate PostgreSQL database for Dagster instead of reusing the main CDC source?"
  expected_answer: "SQLite was too fragile for concurrent runs. Reusing the main CDC database would create a circular dependency: if the source database crashes, the orchestrator would crash with it and be unable to report the failure. We added a dedicated Postgres instance without logical replication to keep them independent. The trade-off is managing an extra service, and we still have open technical debt because run history retention is not configured."
  expected_source_paths:
    - project: sdd-kafka-snowflake-2
      path: docs/adr/0018_dedicated_postgres_for_dagster_storage.md
  grounding_verified: true

- id: q014
  provenance: human
  voice: technical
  intent: decision
  question: "Why did you enforce uniqueness on the Silver join columns instead of just changing the merge key or relying on a row number filter in Gold?"
  expected_answer: "We noticed some Gold tables were joining Silver dimensions on columns that were not the merge key, creating a risk of duplicate matches. We could not simply change the merge key, as that would break our Liquid Clustering alignment and alter the core CDC identity. Relying solely on a row number filter in Gold was also rejected, because it silently chooses a random row and hides data quality problems. Instead, we added a uniqueness check to the Silver contracts for those specific join columns. This sends any duplicates to quarantine so the issue remains visible, while keeping the row number filter as a secondary defense against historical data."
  expected_source_paths:
    - project: sdd-kafka-databricks
      path: docs/adr/005_gold_dimension_join_integrity.md
  grounding_verified: true

- id: q015
  provenance: human
  voice: technical
  intent: decision
  question: "How do you prevent runaway Snowflake credit consumption, and what hard lesson did you learn about cost guardrails?"
  expected_answer: "The main defense against burning credits is a Resource Monitor acting as a hard stop on spending. But we hit a snag: our documentation described two completely different monitors, creating confusion about what was actually enforced. Instead of just guessing which document was right, we decided to treat the versioned SQL script as our reference, and then query the live Snowflake account to verify the actual state. The check revealed that neither monitor existed, and the script we trusted wasn't even in the repository yet. We wrote and applied the correct monitor that same day. The biggest takeaway was that you can never close the question based on documentation alone; you always have to verify the guardrails directly against the live environment."
  expected_source_paths:
    - project: sdd-kafka-snowflake-2
      path: docs/adr/0020_resource_monitor_canonicalization.md
  grounding_verified: true

- id: q016
  provenance: human
  voice: technical
  intent: decision
  question: "In the early stages of the Databricks project, why did you choose to use parametrized notebooks for the Bronze and Silver layers instead of creating a separate notebook for each domain?"
  expected_answer: "Instead of maintaining a massive fleet of static notebooks where a simple logic update would require modifying many files, we built generic notebooks that accepted configuration parameters via widgets. This gave us a centralized change point for any pipeline updates and made the orchestration configuration much cleaner, though a few special cases required either specific parameter overrides or a completely separate notebook."
  expected_source_paths:
    - project: sdd-kafka-databricks
      path: docs/adr/003_parametrized_notebooks.md
  grounding_verified: true

- id: q017
  provenance: human
  voice: technical
  intent: decision
  question: "Why did you remove the global timestamp cursor from the Dagster sensor, and what specific failure mode were you trying to prevent?"
  expected_answer: "We initially tried adding a global timestamp cursor to the rewritten sensor. But a code review caught that this would reintroduce a bug the project had already experienced once: because tasks fire independently, a busy domain could advance the shared cursor, causing older rows from quieter domains to silently fall behind it and be skipped. To prevent this, we dropped the time filter entirely. Now, the sensor simply queries for rows where the consumed flag remains false. This ensures every row is processed a single time without relying on a false assumption about event ordering. We do have one piece of open technical debt, though: there is not yet an automated regression test covering this specific scenario."
  expected_source_paths:
    - project: sdd-kafka-snowflake-2
      path: docs/adr/0024_sensor_without_global_watermark.md
  grounding_verified: true

- id: q018
  provenance: human
  voice: technical
  intent: decision
  question: "How did you handle data quality and quarantine routing when migrating to Lakeflow, given its native limitations?"
  expected_answer: "We discovered that Lakeflow's native data quality actions only warn, drop, or fail the pipeline, which breaks our requirement to route bad data to a dedicated quarantine table. To work around this, we built a custom pattern: for each domain, we created a second table that reads the same upstream data but filters for the exact inverse of our quality rules. This guarantees that invalid records are explicitly captured in quarantine instead of being silently dropped. We also had to implement cross-row uniqueness checks manually as a stream-static join, since there was no native equivalent for that specific rule."
  expected_source_paths:
    - project: sdd-kafka-databricks
      path: docs/adr/006_lakeflow_migration.md
  grounding_verified: true

- id: q019
  provenance: human
  voice: technical
  intent: decision
  question: "When migrating to the newer Kafka connector, why did you decide to retain the metadata variant column instead of relying purely on the new typed columns?"
  expected_answer: "We initially assumed the newer connector's schematization would remove all semi-structured columns. However, we realized that losing the metadata column would strip away our incremental watermark and our deduplication tiebreaker. After inspecting the connector's internal code, we confirmed the metadata column was still being generated. We decided to keep it, using the Kafka offset as a strict per-partition tiebreaker and the creation time for the watermark. This was much safer than trying to invent a synthetic timestamp during the transformation step, which happens at the wrong time, or relying on business timestamps that can be null or backdated."
  expected_source_paths:
    - project: sdd-kafka-snowflake-2
      path: docs/adr/0028_record_metadata_as_watermark.md
  grounding_verified: true

- id: q020
  provenance: human
  voice: technical
  intent: decision
  question: "How does your pipeline handle source database deletions, and what hidden data corruption bug did you uncover during testing?"
  expected_answer: "During manual testing, we uncovered a hidden flaw where deleting a record in the source database would have corrupted the corresponding row in our Silver layer instead of removing it. Our automated test data never actually issued deletions, which is why this path remained unexercised. By default, the database only logs the primary key when a row is deleted. This meant our change capture tool sent a rewrite message full of null values, which our upsert logic would have blindly applied, wiping out the actual data. To fix this, we configured all source tables to log the complete old row during changes. On the processing side, we instructed our streaming framework to explicitly recognize the deletion flag and properly delete the matching row from the target table. It is worth noting that while we successfully verified the source and messaging layers manually, the final processing layer is implemented but still awaiting live workspace validation."
  expected_source_paths:
    - project: sdd-kafka-databricks
      path: docs/adr/008_delete_handling.md
  grounding_verified: true

- id: q021
  provenance: human
  voice: technical
  intent: decision
  question: "Why do you treat the Schema Registry as the absolute source of truth for data types during ingestion, rather than letting the destination system infer them?"
  expected_answer: "We configured the connector to use client-side validation so it reads data types directly from the Schema Registry. We already enforce strict backward compatibility there, meaning the types are intentionally curated and trusted. If we relied on server-side validation, the system would infer types from the very first record it sees, carrying a documented risk of type demotion. For instance, a floating-point column could be demoted to an integer if the initial record contained a whole number. The registry is a much safer authority because the schema is explicitly decided by design, rather than merely inferred from observation."
  expected_source_paths:
    - project: sdd-kafka-snowflake-2
      path: docs/adr/0021_kafka_connector_v4_schematization.md
  grounding_verified: true

- id: q022
  provenance: human
  voice: technical
  intent: decision
  question: "How do you decide whether a dbt test should be an error or a warning, and what is the core principle behind that choice?"
  expected_answer: "We established a convention based on the actual consequence of the failure, rather than just the layer or column type. The core rule is that a test is an error if the violation, left unchecked, would make a business metric objectively wrong, such as a duplicate on a merge key. Conversely, it is a warning if the data is merely degraded but the system remains predictable. For example, a referential gap that simply drops rows the source database never had in the first place doesn't make the metric wrong, just incomplete. Interestingly, this convention was actually applied to our Silver and Gold tests before it was formally ratified, making the final approval a retroactive validation of what was already running."
  expected_source_paths:
    - project: sdd-kafka-snowflake-2
      path: docs/adr/0027_severity_convention.md
  grounding_verified: true

- id: q023
  provenance: human
  voice: technical
  intent: decision
  question: "Why did you decide to cut the number of ingested domains in half, and what was the main trade-off of that decision?"
  expected_answer: "We audited the actual dbt code and discovered that half of our source tables never fed into the downstream Silver or Gold layers; they just stopped at the raw landing zone. Because the newer connector bills based on ingestion volume, keeping those unused tables in the pipeline was a recurring cost with zero business value. Simply skipping them in the transformation step wouldn't have reduced that specific bill, so we had to remove them from the ingestion scope entirely. A perfect example is the payments table: it sounds essential by name, but the project owner confirmed it was actually orphaned, and the real payment flow was handled by a different event table. The trade-off is that we can no longer demo those dropped domains end-to-end if a client asks, but we knowingly accepted that to eliminate wasted ingestion spend."
  expected_source_paths:
    - project: sdd-kafka-snowflake-2
      path: docs/adr/0022_tier_1_ingestion_scope.md
  grounding_verified: true

