# Golden set — draft. Fill during BUILD phase (feature: golden-set-curation).
# Target: 50 questions distributed as documented in README.md
#
# expected_source_paths entries are {project, path} objects. The project is
# mandatory: the two corpus repos share file names (both have README.md), so a
# bare path cannot identify a source document.
#
# Every question declares provenance: human | llm. Under ADR-011 Commitment 1 all
# questions are human-authored; the field exists because retreat A3 permits an LLM
# to propose architecture questions, and the two populations must stay separable
# for stratified Layer 2 audits and stratified RAGAS reporting.
#
# Every question declares voice: recruiter | technical (dev log #23). Recruiters
# ask short questions built on job-posting keywords; hiring managers and
# interviewers ask why a decision was taken. RAGAS is reported per voice.
#
# There is no should_fallback field. Whether a question must fire the fallback is
# derived from intent == "out-of-scope". Two fields encoding one fact drift; the
# derived form cannot.

- id: q001
  provenance: human
  voice: technical
  intent: decision
  question: "Why did the Snowflake project choose Snowpipe Streaming over the classic file-based Snowpipe?"
  expected_answer: "The classic Snowpipe was already running but had file-based ingestion overhead. Streaming was chosen after measuring cost and confirming v4 connector managed pipes met the latency target."
  expected_source_paths:
    - project: sdd-kafka-snowflake-2
      path: docs/adr/0029_snowpipe_streaming_as_the_ingestion_path.md

- id: q002
  provenance: human
  voice: technical
  intent: decision
  question: "Why does the Databricks project use one unified Lakeflow pipeline instead of many parametrized notebooks?"
  expected_answer: "Unity Catalog attributes lineage by notebook path, not by parametrized execution. Twenty Bronze runs of the same notebook collapse to a single lineage node, obscuring per-domain visibility. ADR-007 supersedes ADR-003 for this reason."
  expected_source_paths:
    - project: sdd-kafka-databricks
      path: docs/adr/007_pipeline_unification.md

