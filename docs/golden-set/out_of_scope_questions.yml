# Out-of-scope evaluation set (ADR-020). Measures system-prompt rule 3 only.
#
# Disjoint from evaluation_questions.yml: no shared id, no shared question text.
# The golden set keeps grading; this file only asks whether the fallback fires.
#
# Same entry schema as the golden set's out-of-scope questions, written under
# ADR-016's terms: provenance llm, author approval per entry, contamination
# probes that pass `make verify-adversarials` (Layer 1) before commit, Layer 2
# when an API key exists. Target 30, by band: 12 adjacent, 6 personal,
# 6 off_domain, 6 adversarial. `make golden-set-check` enforces the shape.

