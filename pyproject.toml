# `pip install -e .` failed in CI from the first run this repo ever had:
#
#   error: Multiple top-level packages discovered in a flat-layout:
#          ['sql', 'observability', 'data_platform_rag']
#
# The package lives at the repo root, and setuptools' flat-layout auto-discovery
# treats every sibling directory as a candidate package. `sql/` and
# `observability/` hold no Python at all -- neither has an `__init__.py` -- but
# discovery refuses to guess and stops. Naming the package explicitly is the fix;
# a src-layout would be the other one, and would move every import in the repo.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["data_platform_rag*"]

[project]
name = "data-platform-rag"
version = "0.1.0"
description = "RAG system grounded on production data engineering ADRs"
authors = [{name = "Christian Rocha"}]
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"

dependencies = [
    "streamlit>=1.35",
    "anthropic>=0.28",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "sentence-transformers>=3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
observability = [
    # Pinned to 2.x: the KB and observability/langfuse_client.py are written
    # against the v2 trace()/span()/generation() API. See dev log 2026-09-14.
    "langfuse>=2.50,<3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "bandit>=1.7",
]
eval = [
    # 0.4.x: ADR-008 is written against `ragas.metrics.collections` and
    # `llm_factory(provider="anthropic")`, which 0.2 does not have.
    "ragas>=0.4.3,<0.5",
    "datasets>=4.0",
    # ragas 0.4.3 declares these unpinned, and it imports
    # `langchain_community.chat_models.vertexai`, which langchain-community 0.4
    # removed: an unpinned install resolves to 1.x/0.4 and `import ragas` fails.
    # instructor below 1.11 has no working Anthropic structured output for 0.4's
    # llm_factory; unpinned, the resolver picked 1.3.2.
    "langchain>=0.3,<1",
    "langchain-core>=0.3,<1",
    "langchain-community>=0.3,<0.4",
    "langchain-openai>=0.3,<1",
    "instructor>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
# The package lives at the repo root, not under src/. Without this, every test
# module fails to collect with ModuleNotFoundError unless the package has been
# pip-installed first — which no local setup step does. Fixes `make test` in a
# bare checkout and in CI alike.
pythonpath = ["."]
